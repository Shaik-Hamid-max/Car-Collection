<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Favorite Cars</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background: url('webpage-image.jpg') no-repeat center center fixed;
      background-size: cover;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    .favorites-container {
      margin: 40px auto;
      width: 80%;
      max-width: 800px;
      background: rgba(0,0,0,0.6);
      padding: 20px;
      border-radius: 10px;
    }
    .car-item {
      background: rgba(255,255,255,0.1);
      margin: 10px;
      padding: 15px;
      border-radius: 8px;
      font-size: 18px;
    }
    .clear-btn {
      margin-top: 20px;
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: crimson;
      color: white;
      font-weight: bold;
    }
    .clear-btn:hover {
      background: darkred;
    }
  </style>
</head>
<body>
  <h1>🚘 My Favorite Cars</h1>
  <div class="favorites-container" id="favoritesList">
    <!-- Cars will load here -->
  </div>
  <button class="clear-btn" id="clearFavorites">Clear All Favorites</button>

  <script src="main.js"></script>
</body>
</html>
